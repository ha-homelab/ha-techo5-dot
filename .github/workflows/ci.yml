name: Quality gate

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/python-ci.yml@8008fd1db4c410640e7abddfc8bc75833cdcd970
    with:
      python-version: '3.11'
      install-dependencies: false
      run-lint: false
      run-type-check: false
      test-args: tests -q
      # Report coverage; behavior and publication boundaries are tested explicitly.
      coverage-threshold: 0
      coverage-artifact-name: techo5-python-coverage

  security:
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/security-scan.yml@6b2d99519d513d2b871d2a845ddd6134dea4af2c
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      languages: python,actions
      run-codeql: true
      run-trivy: true
      run-dependency-review: true

  source:
    name: Public source validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Check source and private-data boundaries
        run: |
          python -m compileall -q scripts tests training integrations
          python -m json.tool upstream-lock.json > /dev/null
          python scripts/check_public.py
          python scripts/check_docs.py
          python -m unittest discover -s integrations/guarded-announcement -p 'test_*.py'

  training:
    name: Wake classifier parity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          cache: false
      - name: Install conversion dependencies
        run: python -m pip install -r training/requirements-verify.txt
      - name: Fetch and build the pinned interpreter
        env:
          GOTOOLCHAIN: local
          GOPROXY: 'off'
          GOSUMDB: 'off'
          CGO_ENABLED: '0'
        run: |
          python training/fetch_runtime.py --destination "$RUNNER_TEMP/techo5-parity"
          cd "$RUNNER_TEMP/techo5-parity"
          go build -trimpath -o wakeparity .
      - name: Verify synthetic classification and refusal cases
        env:
          TECHO5_PARITY_RUNTIME: ${{ runner.temp }}/techo5-parity/wakeparity
        run: python -m unittest discover -s training/tests -v

  guarded-announcement:
    name: Guarded announcement source and ARM build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          cache: false
      - name: Apply the exact upstream patch and cross-compile
        run: python integrations/guarded-announcement/build.py --work-dir "$RUNNER_TEMP/guarded-announcement"
      - name: Test request ownership and concurrent admission without devices
        working-directory: ${{ runner.temp }}/guarded-announcement/source/echod
        run: |
          go test -race ./internal/lib/activitygate ./internal/lib/guardedannounce
          go test -race -tags dot ./internal/hardware/speaker -run '^(TestGuarded|TestPlaybackProof|TestAnnouncementIdle)'
          go test -race -tags dot ./internal/feature/media -run '^TestGuardedDuckBypassesTurnPauseWithoutChangingPreference$'
          go test -race -tags dot ./internal/feature/sendspin -run '^TestGuardedMusicRequiresOwnReadyLocalSource$'
          go test -race -tags dot ./internal/feature/voice -run '^TestGuardedManagerRemainsReachableAfterJournalFailure$'

  gate:
    name: CI gate
    needs: [python, security, source, training, guarded-announcement]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Require all validation jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: python3 {0}
        run: |
          import json, os
          results = json.loads(os.environ['RESULTS'])
          expected = {'python', 'security', 'source', 'training', 'guarded-announcement'}
          if set(results) != expected:
              raise SystemExit('Validation job inventory differs')
          failed = {name: value['result'] for name, value in results.items()
                    if value['result'] != 'success'}
          if failed:
              raise SystemExit(f'Validation did not pass: {failed}')
          print('All validation jobs passed.')
