version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /training
    schedule:
      interval: weekly
    # Keep the documented and CI-tested Python 3.11 environment installable.
    ignore:
      - dependency-name: numpy
        versions: [">=2.5"]
    groups:
      wake-tools:
        patterns: ["*"]
