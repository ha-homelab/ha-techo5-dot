<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc">
  <title id="title">Echo Dot pilot: previous and installed architecture</title>
  <desc id="desc">Before migration: Echo Dot with emOS and EchoMuse connected through EchoMuse Controller to Home Assistant. Installed: Echo Dot with TECHO5 connects directly to Home Assistant using the encrypted ESPHome-native API. Installation health, pairing and a software reboot are confirmed; voice and music acceptance remain pending. Home Assistant provides Russian speech recognition, local conversation and speech synthesis.</desc>
