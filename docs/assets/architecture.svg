    <rect x="912" y="417" width="286" height="110" rx="12" fill="#1d5157"/>
    <text x="936" y="454" font-size="21" font-weight="700" fill="#ffffff">Home Assistant</text>
    <text x="936" y="484" font-size="17" fill="#cdf6f2">Russian Assist pipeline</text>
