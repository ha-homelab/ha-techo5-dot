        },
        {
          "action": "script.techo5_example_ring_scene",
          "data": {
            "look": "Energy",
            "duration": 8
          }
        }
      ]
    },
    {
      "id": "techo5_example_energy_pulse",
      "alias": "TECHO5 example: optional periodic energy ring",
      "mode": "single",
      "max_exceeded": "silent",
      "triggers": [
        {
          "trigger": "time_pattern",
          "minutes": "/5"
        }
      ],
      "conditions": [
        {
          "condition": "state",
          "entity_id": "input_boolean.techo5_example_enabled",
          "state": "on"
        },
        {
          "condition": "state",
          "entity_id": "binary_sensor.techo5_example_ready",
          "state": "on"
        },
        {
          "condition": "state",
          "entity_id": "input_boolean.techo5_example_energy_pulse",
          "state": "on"
        }
