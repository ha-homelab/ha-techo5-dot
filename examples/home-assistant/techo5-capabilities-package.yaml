            "duration": 5
          }
        }
      ]
    },
    {
      "id": "techo5_example_availability_notice",
      "alias": "TECHO5 example: debounced availability notice",
      "mode": "single",
      "triggers": [
        {
          "trigger": "state",
          "entity_id": "binary_sensor.techo5_example_connected",
          "to": "off",
          "for": "00:05:00"
        },
        {
          "trigger": "state",
          "entity_id": "input_boolean.techo5_example_health_alerts",
          "to": "on",
          "for": "00:05:00"
        },
        {
          "trigger": "state",
          "entity_id": "input_boolean.techo5_example_enabled",
          "to": "on",
          "for": "00:05:00"
        }
      ],
      "conditions": [
        {
          "condition": "state",
          "entity_id": "input_boolean.techo5_example_enabled",
          "state": "on"
        },
        {
          "condition": "state",
          "entity_id": "input_boolean.techo5_example_health_alerts",
          "state": "on"
        },
        {
          "condition": "state",
          "entity_id": "binary_sensor.techo5_example_connected",
          "state": "off"
        },
        {
          "condition": "template",
          "value_template": "{{ as_timestamp(now()) - as_timestamp(states['binary_sensor.techo5_example_connected'].last_changed) >= 300 }}"
        }
      ],
      "actions": [
        {
          "action": "persistent_notification.create",
          "data": {
            "notification_id": "techo5_example_unavailable",
            "title": "TECHO5 example is unavailable",
            "message": "The Dot has been unavailable for at least five minutes. Check its power supply, cable and Wi-Fi. This package will not reboot it or change credentials."
          }
        }
      ]
    },
    {
      "id": "techo5_example_availability_recovered",
      "alias": "TECHO5 example: clear recovered availability notice",
      "mode": "single",
      "triggers": [
        {
          "trigger": "state",
          "entity_id": "binary_sensor.techo5_example_connected",
          "to": "on",
          "for": "00:00:30"
        }
      ],
      "actions": [
        {
          "action": "persistent_notification.dismiss",
          "data": {
            "notification_id": "techo5_example_unavailable"
          }
        }
      ]
    }
  ]
