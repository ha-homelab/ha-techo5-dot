    {
      "id": "techo5_example_action_hold",
      "alias": "TECHO5 example: opt-in Action hold energy ring",
      "mode": "single",
      "max_exceeded": "silent",
      "triggers": [
        {
          "trigger": "state",
          "entity_id": "event.echo_dot_example_action_button"
        }
      ],
      "conditions": [
        {
          "condition": "state",
          "entity_id": "input_boolean.techo5_example_enabled",
          "state": "on"
        },
        {
          "condition": "state",
          "entity_id": "binary_sensor.techo5_example_ready",
          "state": "on"
        },
        {
          "condition": "state",
          "entity_id": "input_boolean.techo5_example_button_energy",
          "state": "on"
        },
        {
          "condition": "template",
          "value_template": "{{ trigger.from_state is not none and trigger.to_state is not none and trigger.from_state.state not in ['unknown','unavailable'] and trigger.to_state.state not in ['unknown','unavailable'] and trigger.to_state.attributes.get('event_type') == 'hold' and trigger.to_state.state != trigger.from_state.state }}"
        }
      ],
      "actions": [
        {
          "delay": "00:00:01"
        },
        {
          "condition": "state",
          "entity_id": "binary_sensor.techo5_example_ready",
