        {
          "entity": "input_text.techo5_example_reminder_owned_label",
          "name": "Original reminder words",
          "type": "simple-entity"
        }
      ]
    },
    {
      "type": "grid",
      "columns": 2,
      "square": false,
      "cards": [
        {
          "type": "button",
          "name": "Disable panel reminder",
          "tap_action": {
            "action": "perform-action",
            "perform_action": "script.techo5_example_reminder_control",
            "data": {
              "operation": "disable"
            }
          },
          "hold_action": {
            "action": "none"
          }
        },
        {
          "type": "button",
          "name": "Enable panel reminder",
          "tap_action": {
            "action": "perform-action",
            "perform_action": "script.techo5_example_reminder_control",
            "data": {
              "operation": "enable"
            },
            "confirmation": {
              "text": "Enable panel reminder on this Dot?"
            }
          },
          "hold_action": {
            "action": "none"
          }
        },
        {
          "type": "button",
          "name": "Delete panel reminder",
          "tap_action": {
            "action": "perform-action",
            "perform_action": "script.techo5_example_reminder_control",
            "data": {
              "operation": "delete"
            },
            "confirmation": {
              "text": "Delete panel reminder on this Dot?"
            }
          },
          "hold_action": {
            "action": "none"
          }
        }
      ]
    },
    {
      "type": "entities",
      "title": "Explicit voice and volume actions",
      "show_header_toggle": false,
      "entities": [
        "input_number.techo5_example_volume_cap",
        "sensor.techo5_example_suggested_volume",
        "input_text.techo5_example_announcement"
      ]
    },
    {
      "type": "grid",
      "columns": 2,
      "square": false,
      "cards": [
        {
          "type": "button",
          "name": "Apply suggested volume",
          "tap_action": {
            "action": "perform-action",
            "perform_action": "script.techo5_example_apply_room_volume"
          },
          "hold_action": {
            "action": "none"
          }
        },
        {
          "type": "button",
          "name": "Speak announcement",
          "tap_action": {
            "action": "perform-action",
            "perform_action": "script.techo5_example_announce"
          },
          "hold_action": {
            "action": "none"
          }
        }
      ]
    },
    {
      "type": "history-graph",
      "title": "Room light and noise (6 hours)",
      "hours_to_show": 6,
      "entities": [
        "sensor.echo_dot_example_lux",
        "sensor.echo_dot_example_microphone_ambient_noise"
      ]
    },
    {
      "type": "history-graph",
      "title": "Wi-Fi and available memory (6 hours)",
      "hours_to_show": 6,
      "entities": [
        "sensor.echo_dot_example_wifi_signal",
        "sensor.echo_dot_example_memory_available"
      ]
