{
  "type": "vertical-stack",
  "cards": [
    {
      "type": "entities",
      "title": "TECHO5 additional controls",
      "show_header_toggle": false,
      "entities": [
        "input_boolean.techo5_example_enabled",
        "binary_sensor.techo5_example_connected",
        "binary_sensor.techo5_example_ready",
        "sensor.techo5_example_media_profile"
      ]
    },
    {
      "type": "grid",
      "columns": 2,
      "square": false,
      "cards": [
        {
          "type": "button",
          "name": "Wi-Fi + BLE",
          "tap_action": {
            "action": "perform-action",
            "perform_action": "script.techo5_example_media_profile",
            "data": {
              "profile": "Wi-Fi + BLE"
            }
          },
          "hold_action": {
            "action": "none"
          }
        },
        {
          "type": "button",
          "name": "Bluetooth speaker",
          "tap_action": {
            "action": "perform-action",
            "perform_action": "script.techo5_example_media_profile",
            "data": {
              "profile": "Bluetooth speaker"
            },
            "confirmation": {
              "text": "Bluetooth speaker on this Dot?"
            }
          },
          "hold_action": {
            "action": "none"
          }
        }
      ]
    },
    {
      "type": "entities",
      "title": "Receivers and sensors",
      "show_header_toggle": false,
      "entities": [
        "switch.echo_dot_example_airplay",
        "switch.echo_dot_example_airplay_sets_the_volume",
        "switch.echo_dot_example_dlna",
        "switch.echo_dot_example_bluetooth_proxy",
        "switch.echo_dot_example_microphone_ambient_noise_sensor",
        "sensor.echo_dot_example_microphone_ambient_noise",
        "sensor.echo_dot_example_lux"
      ]
    },
    {
      "type": "entities",
      "title": "Ring and optional mappings",
      "show_header_toggle": false,
      "entities": [
        "input_select.techo5_example_energy_source",
        "input_boolean.techo5_example_energy_pulse",
        "input_boolean.techo5_example_button_energy",
        "input_boolean.techo5_example_clap_light",
        "input_boolean.techo5_example_health_alerts"
      ]
    },
    {
      "type": "grid",
      "columns": 2,
      "square": false,
      "cards": [
        {
          "type": "button",
          "name": "Energy for 8 seconds",
          "tap_action": {
            "action": "perform-action",
            "perform_action": "script.techo5_example_ring_scene",
            "data": {
              "look": "Energy",
              "duration": 8
            }
          },
          "hold_action": {
            "action": "none"
          }
        },
        {
          "type": "button",
          "name": "Night light for 30 seconds",
          "tap_action": {
            "action": "perform-action",
            "perform_action": "script.techo5_example_ring_scene",
            "data": {
              "look": "Night light",
              "duration": 30
            }
          },
          "hold_action": {
            "action": "none"
          }
        },
        {
          "type": "button",
          "name": "Information ring",
          "tap_action": {
            "action": "perform-action",
            "perform_action": "script.techo5_example_ring_scene",
            "data": {
              "look": "Information",
              "duration": 8
            }
          },
          "hold_action": {
            "action": "none"
          }
        },
        {
          "type": "button",
          "name": "Completed ring",
          "tap_action": {
            "action": "perform-action",
            "perform_action": "script.techo5_example_ring_scene",
            "data": {
              "look": "Complete",
              "duration": 8
            }
          },
          "hold_action": {
            "action": "none"
          }
        },
        {
          "type": "button",
          "name": "Clear manual ring",
          "tap_action": {
            "action": "perform-action",
            "perform_action": "script.techo5_example_ring_off"
          },
          "hold_action": {
            "action": "none"
          }
        }
      ]
    },
    {
      "type": "entities",
      "title": "Device-owned timer",
      "show_header_toggle": false,
      "entities": [
        "input_number.techo5_example_timer_minutes",
        "input_text.techo5_example_timer_label",
        "sensor.echo_dot_example_timers"
      ]
    },
    {
      "type": "grid",
      "columns": 2,
      "square": false,
      "cards": [
        {
          "type": "button",
          "name": "Start local timer",
          "tap_action": {
            "action": "perform-action",
            "perform_action": "script.techo5_example_timer_start"
          },
          "hold_action": {
            "action": "none"
          }
        },
        {
          "type": "button",
          "name": "Pause panel timer",
          "tap_action": {
            "action": "perform-action",
            "perform_action": "script.techo5_example_timer_control",
            "data": {
              "operation": "pause"
            }
          },
          "hold_action": {
            "action": "none"
          }
        },
        {
          "type": "button",
          "name": "Resume panel timer",
          "tap_action": {
            "action": "perform-action",
            "perform_action": "script.techo5_example_timer_control",
            "data": {
              "operation": "resume"
            }
          },
          "hold_action": {
            "action": "none"
          }
        },
        {
          "type": "button",
          "name": "Add five minutes",
          "tap_action": {
            "action": "perform-action",
            "perform_action": "script.techo5_example_timer_control",
            "data": {
              "operation": "add five minutes"
            }
          },
          "hold_action": {
            "action": "none"
          }
        },
        {
          "type": "button",
          "name": "Cancel panel timer",
          "tap_action": {
            "action": "perform-action",
            "perform_action": "script.techo5_example_timer_control",
            "data": {
              "operation": "cancel"
            }
          },
          "hold_action": {
            "action": "none"
          }
        },
        {
          "type": "button",
          "name": "Stop ringing alarm or timer",
          "tap_action": {
            "action": "perform-action",
            "perform_action": "button.press",
            "data": {
              "entity_id": "button.echo_dot_example_stop_alarm_or_timer"
            }
          },
          "hold_action": {
            "action": "none"
          }
        }
      ]
    },
    {
      "type": "entities",
