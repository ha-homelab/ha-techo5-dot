        {
          "type": "button",
          "name": "Disable panel alarm",
          "tap_action": {
            "action": "perform-action",
            "perform_action": "script.techo5_example_alarm_control",
            "data": {
              "operation": "disable"
            }
          },
          "hold_action": {
            "action": "none"
          }
        },
        {
          "type": "button",
          "name": "Enable panel alarm",
          "tap_action": {
            "action": "perform-action",
            "perform_action": "script.techo5_example_alarm_control",
            "data": {
              "operation": "enable"
            },
            "confirmation": {
              "text": "Enable panel alarm on this Dot?"
            }
          },
          "hold_action": {
            "action": "none"
          }
        },
        {
          "type": "button",
          "name": "Delete panel alarm",
          "tap_action": {
            "action": "perform-action",
            "perform_action": "script.techo5_example_alarm_control",
            "data": {
              "operation": "delete"
            },
            "confirmation": {
              "text": "Delete panel alarm on this Dot?"
            }
          },
          "hold_action": {
            "action": "none"
          }
        }
      ]
