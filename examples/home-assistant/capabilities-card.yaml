        },
        {
          "entity": "sensor.echo_dot_example_phone",
          "name": "Phone"
        },
        {
          "entity": "sensor.echo_dot_example_playback_sendspin_state",
          "name": "Sendspin"
        }
      ]
    },
    {
      "type": "entities",
      "title": "Private intercom through the existing PBX",
      "show_header_toggle": false,
      "entities": [
        "sensor.echo_dot_example_phone",
        "sensor.echo_dot_example_phone_call"
      ]
    },
    {
      "type": "grid",
      "columns": 3,
      "square": false,
      "cards": [
        {
          "type": "button",
          "name": "Call other Dot",
          "icon": "mdi:phone-outgoing",
          "tap_action": {
            "action": "perform-action",
            "perform_action": "script.techo5_example_call_peer",
            "confirmation": {
              "text": "Place an audio call to the other Dot now?"
            }
          },
          "hold_action": {
            "action": "none"
          }
        },
        {
          "type": "button",
          "name": "Answer",
          "icon": "mdi:phone-incoming",
          "tap_action": {
            "action": "perform-action",
            "perform_action": "button.press",
