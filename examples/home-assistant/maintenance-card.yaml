# Read-only Lovelace card for the verified v1.0.40 native schema.
# Replace echo_dot_example with the actual entity prefix.
# Does not enable services, change a switch or record audio.
# Ambient noise stays unknown while its separate switch is off.
# Internal temperatures are not room temperature; load is not CPU percent.
# BLE advertisements are a rate, not proof of active GATT support.
type: entities
title: TECHO5 health
show_header_toggle: false
entities:
  - entity: sensor.echo_dot_example_last_boot
    tap_action:
      action: none
    hold_action:
      action: none
    double_tap_action:
